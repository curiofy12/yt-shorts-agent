name: Daily Short Post

on:
  schedule:
    - cron: "0 16 * * *"   # 16:00 UTC daily - adjust to your best posting time
    - cron: "0 19 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credential files from secrets
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET }}' > client_secret.json
          echo '${{ secrets.YOUTUBE_TOKEN }}' > token.json

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CHANNEL_NICHE: ${{ vars.CHANNEL_NICHE }}
        run: python src/main.py

      - name: Commit updated posts log
        run: |
          git config user.name "yt-agent-bot"
          git config user.email "actions@github.com"
          git add data/posts_log.json
          git diff --staged --quiet || git commit -m "Log post from $(date -u +%Y-%m-%d)"
          git push
