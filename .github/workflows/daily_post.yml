name: Daily Short Post

on:
  schedule:
    - cron: "0 16 * * *"   # 16:00 UTC (8 AM Pacific)  - stock footage
    - cron: "0 19 * * *"   # 19:00 UTC (11 AM Pacific) - illustrated (cartoon) style
    - cron: "0 23 * * *"   # 23:00 UTC (3 PM Pacific)  - stock footage
    - cron: "0 3 * * *"    # 03:00 UTC (7 PM Pacific)  - illustrated (cartoon) style
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
    inputs:
      style:
        description: "Video style"
        type: choice
        options: [stock, illustrated, globe]
        default: stock
      dry_run:
        description: "Test only: render the video but don't upload it"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fontconfig

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credential files from secrets
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET }}' > client_secret.json
          echo '${{ secrets.YOUTUBE_TOKEN }}' > token.json

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHANNEL_NICHE: ${{ vars.CHANNEL_NICHE }}
          VIDEO_STYLE: ${{ github.event_name == 'schedule' && (contains(fromJSON('["0 19 * * *", "0 3 * * *"]'), github.event.schedule) && 'illustrated' || 'stock') || inputs.style }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python src/main.py

      - name: Save test video
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview/
          retention-days: 7

      - name: Publish test video to the preview branch
        if: ${{ inputs.dry_run }}
        run: |
          cd preview
          git init -q -b preview
          git config user.name "yt-agent-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Test render from run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview

      - name: Commit updated posts log
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "yt-agent-bot"
          git config user.email "actions@github.com"
          git add data/posts_log.json
          git diff --staged --quiet || git commit -m "Log post from $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
